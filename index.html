<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>
</head>
<body>
<title>五界魔塔</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: a stone tower frame — status scroll on the left, the 11x11 dungeon in the middle, the monster manual & log on the right; all stacks on a phone. Single dark dungeon theme by choice. */
:root{
  --ink:#0e0c12;        /* deep dungeon night */
  --stone:#1d1a24;      /* panel stone */
  --stone-2:#2a2633;    /* raised stone */
  --line:#4a4356;       /* mortar */
  --parchment:#e8dcc0;  /* body text */
  --dim:#9d93a8;        /* secondary text */
  --brass:#d8a94a;      /* accent: brass / torchlight */
  --blood:#c9433b;      /* hp / danger */
  --mana:#4f8fd6;       /* blue keys & gems */
  --moss:#5ca864;       /* good */
  --display:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;
  --body:'Noto Sans SC',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--parchment);font-family:var(--body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:14px 24px;
  background-image:radial-gradient(ellipse at 50% 0%,#2b2236 0%,var(--ink) 60%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;letter-spacing:.06em;color:var(--brass);text-shadow:0 0 18px rgba(216,169,74,.25)}
h1 small{font-size:14px;color:var(--dim);letter-spacing:.2em;margin-left:10px;font-family:var(--body)}
.hint{color:var(--dim);font-size:12.5px}
.board{display:grid;grid-template-columns:200px auto 230px;gap:12px;align-items:start}
.panel{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:12px}
.panel h2{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.18em;color:var(--brass);margin:0 0 8px;text-transform:uppercase}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.stat dt{color:var(--dim)} .stat dd{margin:0;text-align:right;font-family:var(--mono);font-size:14px}
.stat dd small{color:var(--dim);font-size:11px;margin-left:3px}
.stat dd.hp{color:#ff8a7a} .stat dd.atk{color:#f0c674} .stat dd.def{color:#8fc1ff} .stat dd.gold{color:var(--brass)}
.keys{display:flex;gap:8px;margin-top:10px}
.key{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:var(--stone-2);border-radius:4px;font-family:var(--mono);font-size:14px}
.key i{display:block;width:10px;height:18px;border-radius:5px 5px 2px 2px}
.key.y i{background:#e9c54a}.key.b i{background:var(--mana)}.key.r i{background:var(--blood)}
.floorTag{font-family:var(--display);font-size:26px;color:var(--parchment);letter-spacing:.1em;text-align:center;margin:2px 0 8px}
.floorTag span{color:var(--brass)}
.stage{position:relative;justify-self:center;width:100%;max-width:528px}
canvas#map{display:block;width:100%;aspect-ratio:1/1;border:4px solid #3a3346;border-radius:4px;background:#111;box-shadow:0 0 0 1px #000,0 10px 40px rgba(0,0,0,.6)}
.overlay{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.84);border-radius:2px}
.dialog{background:var(--stone);border:1px solid var(--brass);border-radius:6px;padding:18px 20px;max-width:360px;width:90%;box-shadow:0 10px 40px #000}
.dialog h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 6px;color:var(--brass);letter-spacing:.1em}
.dialog p{margin:0 0 12px;color:var(--parchment)}
.dialog .opts{display:flex;flex-direction:column;gap:6px}
.btn{background:var(--stone-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;text-align:left;display:flex;justify-content:space-between;gap:8px}
.btn:hover{border-color:var(--brass)} .btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{border-color:var(--brass);color:var(--brass);justify-content:center}
.btn b{font-family:var(--mono);font-weight:400;color:var(--brass)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dialog.bag{max-width:440px;max-height:90%;overflow:auto}
.eqlist{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.eqlist .sec{font-family:var(--display);letter-spacing:.15em;color:var(--brass);font-size:13px;margin-top:6px}
.eq{display:grid;grid-template-columns:40px 1fr;gap:4px 8px;align-items:center;padding:5px 6px;background:var(--stone-2);border-radius:4px;border-left:3px solid var(--line);font-size:12.5px}
.eq.q2{border-left-color:#6cc46f}.eq.q3{border-left-color:#5a9df0}.eq.q4{border-left-color:#b86ae0}.eq.q5{border-left-color:#f2cf4e}
.eq .sl{color:var(--dim);display:flex;flex-direction:column;align-items:center;font-size:11px} .eq .sl small{font-size:9.5px;opacity:.8} .eq .sl img{width:26px;height:26px;display:block} .eq .nm i{font-style:normal;color:var(--moss)} .eq .dim,.dim{color:var(--dim)}
.eq .ops{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.mini{background:var(--stone);border:1px solid var(--line);border-radius:3px;padding:2px 7px;font-size:11.5px}
.mini:hover{border-color:var(--brass)}
.toolbar .btn{padding:5px 9px;font-size:12.5px}
.dpad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px;justify-content:center;margin-top:10px;user-select:none;-webkit-user-select:none}
.dpad button{background:var(--stone-2);border:1px solid var(--line);border-radius:6px;font-size:22px;touch-action:manipulation}
.dpad button:active{background:var(--line)}
.manual{display:flex;flex-direction:column;gap:6px}
.mon{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;padding:5px 6px;background:var(--stone-2);border-radius:4px}
.mon img{width:34px;height:34px;display:block}
.mon .n{font-size:13px} .mon .s{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.mon .d{font-family:var(--mono);font-size:12px}
.stars{color:#ffd34d;font-size:11px;letter-spacing:-1px} .stars.boss{color:#ff5a2a} .d.ok{color:var(--moss)} .d.warn{color:var(--brass)} .d.bad{color:#ff8a7a}
.items{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.it{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;padding:2px 4px}
.it img{width:24px;height:24px;display:block;object-fit:contain}
.toast{position:absolute;z-index:4;left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(20,16,28,.96);border:1px solid var(--brass);border-radius:8px;padding:8px 14px 8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;max-width:92%;animation:toastIn .25s ease-out}
.toast img{width:40px;height:40px;display:block;flex:none}
.toast .t1{font-size:11px;letter-spacing:.15em;color:var(--dim)} .toast .t2{font-size:14px;font-weight:700} .toast .t3{font-size:12px;color:var(--parchment)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.tip{position:absolute;z-index:3;pointer-events:none;background:rgba(20,16,28,.95);border:1px solid var(--brass);border-radius:5px;padding:7px 10px;font-size:12.5px;line-height:1.45;max-width:170px;color:var(--parchment);box-shadow:0 6px 20px rgba(0,0,0,.5)}
.tip b{color:var(--brass);font-weight:700} .tip i{font-style:normal;color:var(--moss)} .tip i.bad{color:#ff8a7a}
.log{margin-top:10px;font-size:12.5px;color:var(--dim);max-height:150px;overflow:auto;display:flex;flex-direction:column-reverse;gap:2px}
.log .new{color:var(--parchment)}
.legend{margin-top:10px;font-size:12px;color:var(--dim);line-height:1.6}
@media (max-width:860px){
  .board{grid-template-columns:1fr 1fr}
  .stage{grid-column:1 / -1;order:-1}
}
@media (max-width:560px){
  .board{grid-template-columns:1fr}
  .dpad{display:grid}
  h1{font-size:28px}
}
@media (hover:none) and (pointer:coarse){.dpad{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header>
    <h1><span id="worldName">魔塔</span><small id="worldSub">MAGIC TOWER · 51F</small></h1>
    <div class="hint">点击任意格子自动走过去（点怪物即战斗、点门即开门）· 也可用方向键 / WASD · B 背包 · F 传送 · 悬停查看说明</div>
  </header>

  <div class="board">
    <section class="panel" aria-label="勇士状态">
      <div class="floorTag"><span id="floorPre">第 </span><span id="floorNo">1</span><span id="floorSuf"> 层</span></div>
      <h2>勇士</h2>
      <dl class="stat">
        <dt>等级</dt><dd id="lvl">1</dd>
        <dt>生命</dt><dd class="hp" id="hp">1000</dd>
        <dt>攻击</dt><dd class="atk" id="atk">10</dd>
        <dt>防御</dt><dd class="def" id="def">10</dd>
        <dt>暴击</dt><dd id="crit">0%</dd>
        <dt>闪避</dt><dd id="dodge">0%</dd>
        <dt>吸血</dt><dd id="steal">0%</dd>
        <dt>金币</dt><dd class="gold" id="gold">0</dd>
        <dt>经验</dt><dd id="exp">0</dd>
        <dt>升级还需</dt><dd id="need">80</dd>
        <dt>道路</dt><dd id="pathName">—</dd>
      </dl>
      <div class="keys">
        <div class="key y"><i></i><span id="ykey">1</span></div>
        <div class="key b"><i></i><span id="bkey">0</span></div>
        <div class="key r"><i></i><span id="rkey">0</span></div>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="bagBtn">背包</button>
        <button class="btn" id="flyBtn" hidden>传送</button>
        <button class="btn" id="holyBtn" hidden>圣水</button>
        <button class="btn" id="saveBtn">存档</button>
        <button class="btn" id="loadBtn">读档</button>
        <button class="btn" id="resetBtn">重新开始</button>
        <button class="btn" id="setBtn">设置</button>
      </div>
      <div class="toolbar" id="testBar" hidden>
        <span style="color:var(--blood);font-size:12px;align-self:center">测试模式</span>
        <button class="btn" id="floorDown">↓ 下一层</button>
        <button class="btn" id="floorUp">↑ 上一层</button>
      </div>
      <div class="legend">
        每升一级：生命与攻防提升，等级越高提升越多。<br>怪物头顶的 ★ 是其种族星级（1~5），星越多越强。<br>
        战斗公式：你每回合造成 攻−怪防，怪物造成 怪攻−你防，你先手。
      </div>
    </section>

    <div class="stage">
      <canvas id="map" width="528" height="528" aria-label="塔内地图"></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <div class="overlay" id="overlay" hidden></div>
      <div class="dpad" id="dpad">
        <span></span><button data-d="0,-1" aria-label="上">▲</button><span></span>
        <button data-d="-1,0" aria-label="左">◀</button><span></span><button data-d="1,0" aria-label="右">▶</button>
        <span></span><button data-d="0,1" aria-label="下">▼</button><span></span>
      </div>
    </div>

    <section class="panel" aria-label="怪物手册">
      <h2>怪物手册 <span id="monCount" style="font-family:var(--mono);font-size:12px;letter-spacing:0;color:var(--dim)"></span></h2>
      <div class="manual" id="manual"></div>
      <h2 style="margin-top:14px">本层图鉴</h2>
      <div class="items" id="legend"></div>
      <div class="log" id="log"></div>
    </section>
  </div>
</div>

const FLOORS = 51;   // 1~50 魔塔 + 51 魔王殿；maps[51] 是隐藏层“宝库”
// 隐藏支线：from = 入口层下标（裂纹墙→暗梯），start = 支线第一层的 maps 下标，n = 层数，vault = 宝库下标
// maps 下标 = 楼层号：0 序章，1~50 魔塔，51 魔王殿，52 起为隐藏支线
const BRANCHES = [ {from:10, start:52, n:1}, {from:20, start:53, n:2}, {from:30, start:55, n:2, arena:57}, {from:40, start:58, n:3, vault:61} ];
const HIDDEN_START = 52, ARENA = 57, VAULT = 61;
const branchOf = f => BRANCHES.find(b => f>=b.start && f<b.start+b.n);
const floorLabel = f => f===0 ? '序章' : f===VAULT ? '宝库' : f===ARENA ? '试炼之间' : branchOf(f) ? `隐藏 ${f-branchOf(f).start+1} 层` : `第 ${f} 层`;
// ───────────── 试炼之间：怪物会重生，每波更强，回报增长更慢，无药水 ─────────────
const ARENA_SPAWNS = [[5,2],[4,3],[6,3],[3,4],[7,4],[2,5],[8,5],[5,6]];     // 楔形列阵：首领在顶点，两翼展开，先锋在最前
const ARENA_ROLES  = ['demon','wraith','wraith','golem','golem','wraith','wraith','demon'];
const ARENA_NAMES  = {demon:'深渊魔将', wraith:'虚空死灵', golem:'符文巨像'};
const ARENA_CHARS = '[]{}();:'.split('');
const ARENA_BASE = () => Object.keys(MON).filter(k=>!MON[k].boss&&!MON[k].elite&&!ARENA_CHARS.includes(k)&&MON[k].lvl>=26&&MON[k].lvl<=36);
function arenaWaveDefs(wave){
  const base=ARENA_BASE(); const sm=Math.pow(1.15,wave-1), rm=Math.pow(1.08,wave-1);
  return ARENA_CHARS.map((ch,i)=>{ const b=MON[base[(wave*3+i)%base.length]]; const role=ARENA_ROLES[i]; const lead = role==='demon' ? 1.3 : 1;   // 首领与先锋更强
    return [ch, {name:ARENA_NAMES[role], spr:'arena_'+role, hue:0, star:Math.min(5,b.star+Math.floor((wave-1)/4)+(role==='demon'?1:0)), lvl:b.lvl, arena:true, wave,
      hp:Math.round(b.hp*sm*lead), atk:Math.round(b.atk*sm*lead), def:Math.round(b.def*sm), gold:Math.round(b.gold*rm*lead), exp:Math.round(b.exp*rm*lead)}]; });
}
function setupArena(spawn){           // 重建当前波次的怪物定义；spawn=true 时把怪放回场上
  if (!G.arena) G.arena={wave:1, cleared:0};
  for (const [ch,def] of arenaWaveDefs(G.arena.wave)) MON[ch]=def;
  if (spawn){ const m=G.maps[ARENA]; ARENA_SPAWNS.forEach(([x,y],i)=>{ if (!(G.floor===ARENA && G.x===x && G.y===y)) m[y][x]=ARENA_CHARS[i]; }); }
}
const ARENA_CIRCLE = [5,8];      // 召唤阵位置（楼梯口正上方）
let summon=null;                 // {t0} 站在召唤阵上的倒计时
function arenaHasMonsters(){ return G.maps[ARENA].some(r=>r.some(c=>ARENA_CHARS.includes(c))); }
function arenaAfterKill(){
  if (arenaHasMonsters()) return;
  const w=G.arena.wave; G.arena.cleared=w;
  if (w%5===0){ G.maps[ARENA][8][5]='&'; log(`第 ${w} 波清空！楼梯口上方出现了一袋精华。`,true); } else log(`第 ${w} 波清空。`,true);
  G.arena.wave=w+1; log('站到中央的召唤阵上，3 秒后下一波会出现。'); save(true);
}
function checkSummon(){
  const onCircle = G.floor===ARENA && G.x===ARENA_CIRCLE[0] && G.y===ARENA_CIRCLE[1];
  if (onCircle && G.arena && !arenaHasMonsters()){ if (!summon){ summon={t0:performance.now()}; requestAnimationFrame(render); } }
  else summon=null;
}
function tickSummon(now){
  if (!summon) return;
  const left = 3000/SET.speed - (now-summon.t0);
  if (left<=0){ summon=null; setupArena(true); log(`第 ${G.arena.wave} 波列阵完毕：深渊魔将领军，两翼虚空死灵与符文巨像。比上一波强 15%。`,true); save(true); return; }
  // 倒计时文字画在召唤阵上方
  ctx.save(); ctx.font='bold 16px '+getComputedStyle(document.body).getPropertyValue('--mono'); ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='#1a1522'; ctx.fillStyle='#c98cf0';
  const x=ARENA_CIRCLE[0]*T+T/2, y=ARENA_CIRCLE[1]*T-4; ctx.strokeText(`召唤 ${Math.ceil(left/1000*SET.speed)}`,x,y); ctx.fillText(`召唤 ${Math.ceil(left/1000*SET.speed)}`,x,y); ctx.restore();

  const q = Math.random()<t*0.10 ? 5 : Math.random()<t*0.25 ? 4 : Math.random()<t*0.5 ? 3 : Math.random()<0.45 ? 2 : 1;
  return makeEq(slot, q, f);
}
// 期望与最坏情况：预览用期望，是否允许开打用最坏情况（无暴击、无闪避）
function battleInfo(ch){
  const m=MON[ch], h=G.hero;
  const atk=effAtk(), def=effDef(), c=critP(), dg=dodgeP(), ls=stealP();
  const hd = atk - m.def; if (hd<=0) return {ok:false, dmg:Infinity, worst:Infinity, turns:Infinity};
  const turnsW = Math.ceil(m.hp/hd), md = Math.max(0, m.atk - def);
  const worst = (turnsW-1)*md;
  const turnsE = Math.ceil(m.hp/(hd*(1+c*(critMul()-1))));
  const heal = Math.round(Math.min(m.hp, hd*(1+c*(critMul()-1))*turnsE)*ls);
  const dmg = Math.max(0, Math.round((turnsE-1)*md*(1-dg) - heal));
  return {ok:true, dmg, worst, turns:turnsE, md, hd, c, dg, ls};
}
// 实际结算：逐回合掷骰，返回回合记录
function simulate(ch){
  const m=MON[ch], h=G.hero; const atk=effAtk(), def=effDef(), c=critP(), dg=dodgeP(), ls=stealP();
  const hd=atk-m.def, md=Math.max(0,m.atk-def); let mhp=m.hp, taken=0, healed=0; const rounds=[];
  for (let t=0;t<999 && mhp>0;t++){
    const crit=Math.random()<c; const dealt=Math.min(mhp, Math.round(hd*(crit?critMul():1))); mhp-=dealt; const hl=Math.round(dealt*ls); healed+=hl;
    let got=0, miss=false; if (mhp>0){ miss=Math.random()<dg; got=miss?0:md; taken+=got; }
    rounds.push({dealt,crit,taken:got,miss,heal:hl,mhp});
  }
  return {rounds, taken, healed, net:taken-healed};
}

const TINT = {};
function tinted(key, hue, tint){
  if (!hue && !tint) return IMG[key];
  const id=key+'@'+hue+(tint?tint[0]+tint[1]:''); if (TINT[id]) return TINT[id];
  const base=IMG[key]; if(!base||!base.complete||!base.naturalWidth) return base;

  // YIQ 色相旋转矩阵
  const m=[0.299+0.701*cs+0.168*sn, 0.587-0.587*cs+0.330*sn, 0.114-0.114*cs-0.497*sn,
           0.299-0.299*cs-0.328*sn, 0.587+0.413*cs+0.035*sn, 0.114-0.114*cs+0.292*sn,

  for (let i=0;i<p.length;i+=4){ const r=p[i],g=p[i+1],b=p[i+2];
    // 皮肤色与描边不旋转（低饱和或接近肤色），其余旋转
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b); if (mx-mn<40) continue; if (r>200&&g>150&&b>120&&r>g&&g>b) continue;

function drawFloor(ctx,x,y,seed){ const th=theme();
  ctx.fillStyle = th.grout; ctx.fillRect(x,y,T,T);            // 石缝
  ctx.fillStyle = th.tile; ctx.fillRect(x+1,y+1,T-2,T-2);    // 石板
  ctx.fillStyle = th.hi; ctx.fillRect(x+1,y+1,T-2,2);        // 顶部受光
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  for (let i=0;i<3;i++){ const s=(seed*31+i*17)%40; ctx.fillRect(x+4+s%38, y+6+(s*7)%36, 4, 4); }
}
function drawWall(ctx,x,y,row){ const th=theme();
  ctx.fillStyle = th.wall; ctx.fillRect(x,y,T,T);            // 砖缝（深）
  const off = (row%2)*12;
  for (let j=0;j<2;j++) for (let i=-1;i<3;i++){
    const bx = x+((i*24+off+j*12)%T+T)%T, by = y+j*24+2;
    ctx.fillStyle = th.brick; ctx.fillRect(bx, by, 21, 20);   // 砖面
    ctx.fillStyle = th.bhi; ctx.fillRect(bx, by, 21, 3);    // 砖顶高光
  }
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x,y+T-2,T,2); ctx.fillRect(x+T-2,y,2,T);
}

  while (h.exp >= needExp(h.lvl)){ const g=levelGain(h.lvl); h.lvl++; h.hp+=g.hp; h.atk+=g.atk; h.def+=g.def; log(`升到了 ${h.lvl} 级！生命 +${g.hp}，攻防 +${g.atk}。`,true); }
}

function tryMove(dx,dy){

  const nx=G.x+dx, ny=G.y+dy; if(nx<0||ny<0||nx>=N||ny>=N){ render(); return; }

  else if (ch==='<') { if(G.floor===0){ render(); return; } const p=stairsOf(G.floor-1,'>'); G.floor--; G.x=p.x; G.y=p.y; log(`回到${floorLabel(G.floor)}。`); }
  else if (DOOR[ch]) { const k=DOOR[ch]; if(h[k]>0){ h[k]--; m[ny][nx]='.'; log(`用${ITEM[k[0]].name}打开了门。`);} else log(`需要${ITEM[k[0]].name}。`); }
  else if (ch==='S'||ch==='T') {
    const it=itemAt(ch,G.floor); const q=MAT_Q[it.mat]||1; const e=makeEq(ch==='S'?'sword':'shield', q, G.floor, it.mat); e.base=Math.round(it.v/QUAL[q].m*100)/100; m[ny][nx]='.'; G.x=nx; G.y=ny; gainEquip(e,'拾得');
  }
  else if (ch==='3'||ch==='4'||ch==='5') {
    const it=itemAt(ch,G.floor); const e=makeEq(it.slot, it.q, G.floor); m[ny][nx]='.'; G.x=nx; G.y=ny; gainEquip(e,'拾得');
  }
  else if (ITEM[ch]) {
    const it = itemAt(ch,G.floor);
    h[it.k]+=it.v; m[ny][nx]='.'; G.x=nx; G.y=ny;
    log(it.k==='holy'?'获得圣水：在左侧面板随时使用，回复当前生命的 30%。' : it.k==='hp'?`${it.name}：生命 +${it.v}` : it.k==='manual'?'获得怪物手册：点击怪物或看右侧，可预览伤害。' : /key/.test(it.k)?`获得${it.name}`:`${it.name}：${it.k==='atk'?'攻击':'防御'} +${it.v}`);
  }
  else if (MON[ch]) {
    const b=battleInfo(ch), mo=MON[ch];

    if (b.worst>=h.hp){ log(`${mo.name}最坏会造成 ${b.worst} 伤害，现在去送死。`); render(); return; }
    const sim = G.test ? {rounds:[{dealt:mo.hp,crit:false,taken:0,miss:false,heal:0,mhp:0}],taken:0,healed:0,net:0} : simulate(ch);
    const finish=()=>{ h.hp=Math.max(1,h.hp-sim.net); h.gold+=mo.gold; m[ny][nx]='.'; G.x=nx; G.y=ny;
      const crits=sim.rounds.filter(r=>r.crit).length, misses=sim.rounds.filter(r=>r.miss).length;

      gainExp(mo.exp); const drop=rollDrop(mo,G.floor); if(drop) gainEquip(drop,`${mo.name}掉落了`); if (G.floor===ARENA && mo.arena) arenaAfterKill(); flash(nx,ny); render(); };
    if (SET.anim && !G.test) { playBattle(nx,ny,ch,sim,finish); return; }
    finish();
  }
  else if (ch==='$') {

    let x0=N,y0=N,x1=-1,y1=-1; for (let yy=0;yy<N;yy++) for (let xx=0;xx<N;xx++) if (m[yy][xx]==='$'){ x0=Math.min(x0,xx);y0=Math.min(y0,yy);x1=Math.max(x1,xx);y1=Math.max(y1,yy); }
    const w=x1-x0+1; const doorX = w%2 ? [x0+(w>>1)] : [x0+(w>>1)-1, x0+(w>>1)];

  }

  else if (ch==='7') { G.x=nx; G.y=ny; m[ny][nx]='.'; let n=0; for(const row of m) for(let i=0;i<N;i++) if(row[i]==='8'){ row[i]='.'; n++; } G.plates[G.floor]=true; flash(nx,ny); log(n?`踏板沉了下去，${n} 面机关墙缓缓打开。`:'踏板沉了下去，但什么也没发生。',true); }
  else if (ch==='9') { openAltar(nx,ny); }
  else if (ch==='0') { openCurse(nx,ny); }
  else if (ch==='o') { const g=15*G.floor, v=gemV(G.floor); h.gold+=g; h.atk+=v; h.def+=v; m[ny][nx]='.'; G.x=nx; G.y=ny; flashText(nx,ny,`+${g}金 攻防+${v}`,'#ffe08a'); log(`打开宝箱：金币 +${g}，攻击 +${v}，防御 +${v}。`,true); }
  else if (ch==='&') { h.essence+=25; m[ny][nx]='.'; G.x=nx; G.y=ny; flashText(nx,ny,'精华 +25','#b86ae0'); log('精华袋：精华 +25。',true); }
  else if (ch==='*') { m[ny][nx]='.'; G.x=nx; G.y=ny; const slots=['sword','shield','boots','hat','ring']; gainEquip(makeEq(slots[Math.floor(Math.random()*5)],5,G.floor),'黄金宝匣里是'); }
  else if (ch==='!') { const br=BRANCHES.find(b=>b.from===G.floor); if (br){ const p=stairsOf(br.start,'<'); G.floor=br.start; G.x=p.x; G.y=p.y; log(`你沿暗梯而上，进入了不在图纸上的隐藏楼层……（这条支线共 ${br.n} 层${br.vault?'，尽头是宝库':''}）`,true); save(true); } }
  else if (ch==='%') { let left=0; for(const row of m) for(const c of row) if(MON[c]) left++;
    if (left===0){ m[ny][nx]='.'; flash(nx,ny); log('本层已无怪物，清场门缓缓开启。',true); } else log(`清场门紧闭：本层还有 ${left} 只怪物。`); }
  render();
}

function openShop(){

  const pay=(p,fn,msg)=>{ if(h.gold<p) return; h.gold-=p; G.shopBought[f]=n+1; fn(); log(`${SHOP_NAMES[st]}：${msg}，花费 ${p} 金。`); openShop(); };
  const opts=[];
  if (st<=3) opts.push([`生命 +${gain.hp}`, price+' 金', ()=>pay(price,()=>h.hp+=gain.hp,`生命 +${gain.hp}`), h.gold<price]);
  opts.push([`攻击 +${gain.atk}`, price+' 金', ()=>pay(price,()=>h.atk+=gain.atk,`攻击 +${gain.atk}`), h.gold<price]);
  opts.push([`防御 +${gain.def}`, price+' 金', ()=>pay(price,()=>h.def+=gain.def,`防御 +${gain.def}`), h.gold<price]);
  if (st===2){ const kp=Math.round(price*0.6); opts.push([`黄钥匙 ×2`, kp+' 金', ()=>pay(kp,()=>h.ykey+=2,'黄钥匙 ×2'), h.gold<kp]); }

function playBattle(mx,my,ch,sim,done){
  const mo=MON[ch], h=G.hero;
  // 回合太多时压缩显示：最多演 6 段，每段合并若干回合
  const all=sim.rounds, shown=Math.min(all.length,6), per=Math.ceil(all.length/shown);
  const rounds=[]; let hhp=h.hp;
  for(let i=0;i<shown;i++){
    const seg=all.slice(i*per,(i+1)*per); if(!seg.length) break;
    const dealt=seg.reduce((a,r)=>a+r.dealt,0), taken=seg.reduce((a,r)=>a+r.taken,0), heal=seg.reduce((a,r)=>a+r.heal,0);
    hhp+=heal-taken;
    rounds.push({dealt,taken,heal,crit:seg.some(r=>r.crit),miss:seg.some(r=>r.miss),mhp:seg[seg.length-1].mhp,hhp});
  }
  const dir={x:Math.sign(mx-G.x), y:Math.sign(my-G.y)};
  BATTLE={mx,my,ch,mo,rounds,dir,t0:performance.now(),dur:Math.max(360, 320*rounds.length)/SET.speed,
          mhp:mo.hp, hhp:h.hp, mhpMax:mo.hp, hhpMax:h.hp, floats:[], fired:0, done};
  requestAnimationFrame(render);
}
function stepBattle(now){
  const B=BATTLE; const per=B.dur/B.rounds.length; const t=now-B.t0;
  const idx=Math.min(B.rounds.length, Math.floor(t/per));
  // 触发到 idx 之前的回合结算（飘字 + 血条）
  while (B.fired<idx){ const r=B.rounds[B.fired]; B.mhp=r.mhp; B.hhp=r.hhp;
    B.floats.push({x:B.mx,y:B.my,text:(r.crit?'暴击 ':'')+'-'+r.dealt,color:r.crit?'#ff9d3a':'#ffe28a',t:now});
    if (r.taken>0) B.floats.push({x:G.x,y:G.y,text:'-'+r.taken,color:'#ff7b7b',t:now+90});
    else if (r.miss) B.floats.push({x:G.x,y:G.y,text:'闪避',color:'#8fe3ff',t:now+90});
    if (r.heal>0) B.floats.push({x:G.x,y:G.y,text:'+'+r.heal,color:'#7fe39a',t:now+180});
    B.fired++; }
  const phase=(t%per)/per;               // 0..1 当前回合进度
  const lunge = phase<0.5 ? Math.sin(phase*2*Math.PI) : 0;           // 勇士前冲
  const mlunge = phase>=0.5 && B.mhp>0 ? Math.sin((phase-0.5)*2*Math.PI) : 0; // 怪物反击
  const hit = phase>0.2 && phase<0.35;    // 斩击闪光
  B.heroOff={x:0,y:0}; B.monOff={x:0,y:0};   // 战斗中双方原地不动
  B.hit=hit; B.monHit = phase>0.22 && phase<0.4;
  if (t>=B.dur+260){ const d=B.done; BATTLE=null; d(); return false; }
  return true;
}

function stopAuto(){ if (AUTO){ clearTimeout(AUTO.timer); AUTO=null; } }
function findPath(tx,ty){
  const m=G.maps[G.floor]; const start=[G.x,G.y]; const key=(x,y)=>y*N+x;
  const prev=new Map(); prev.set(key(G.x,G.y),-1); const q=[start];
  const target=m[ty][tx]; const goalIsPass=passable(target);
  while (q.length){
    const [x,y]=q.shift();
    if (goalIsPass && x===tx && y===ty) break;
    if (!goalIsPass && Math.abs(x-tx)+Math.abs(y-ty)===1) { prev.set(key(tx,ty), key(x,y)); break; }
    for (const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=N||ny>=N) continue;
      const k=key(nx,ny); if (prev.has(k)) continue; const c=m[ny][nx];
      if (!passable(c)) continue; prev.set(k,key(x,y)); q.push([nx,ny]); }
  }
  if (!prev.has(key(tx,ty))) return null;
  const path=[]; let k=key(tx,ty); while (k!==-1 && k!==key(G.x,G.y)){ path.push([k%N, Math.floor(k/N)]); k=prev.get(k); }
  return path.reverse();
}
function autoGo(tx,ty){
  stopAuto(); if (G.won||G.dead||!overlay.hidden||BATTLE) return;
  const m=G.maps[G.floor]; const ch=m[ty]&&m[ty][tx]; if (ch===undefined||ch==='#'||(tx===G.x&&ty===G.y)) return;
  // 目标是会掉大量血的怪物时，先预览，再点一次才出发
  if (MON[ch]){ const b=battleInfo(ch); const pk=G.floor+':'+tx+','+ty;
    if (!b.ok){ log(`${MON[ch].name}：你的攻击打不穿它的防御。`); return; }
    if (b.worst>=G.hero.hp){ log(`${MON[ch].name}最坏会造成 ${b.worst} 伤害，现在去是送死。`); return; }
    if (b.dmg>G.hero.hp*0.3 && pendingTarget!==pk){ pendingTarget=pk; log(`${MON[ch].name}：预计损失 ${b.dmg} 生命（${Math.round(b.dmg/G.hero.hp*100)}%）。再点一次确认前往。`); return; } }
  pendingTarget=null;
  const path=findPath(tx,ty); if (!path){ log('走不到那里。'); return; }
  AUTO={path, i:0, timer:null};
  const step=()=>{
    if (!AUTO || !overlay.hidden || BATTLE){ if (AUTO && (BATTLE||!overlay.hidden)) { AUTO.timer=setTimeout(step, 200); } return; }   // 战斗/弹窗中等待
    if (AUTO.i>=AUTO.path.length){ AUTO=null; return; }
    const [nx,ny]=AUTO.path[AUTO.i]; const dx=Math.sign(nx-G.x), dy=Math.sign(ny-G.y);
    if (Math.abs(nx-G.x)+Math.abs(ny-G.y)!==1){ AUTO=null; return; }          // 位置变了（换层/传送），停
    const before=G.floor+':'+G.x+','+G.y; tryMove(dx,dy);
    const last = AUTO && AUTO.i===AUTO.path.length-1;
    if (AUTO){ AUTO.i++; if (last){ AUTO=null; return; }
      if (G.floor+':'+G.x+','+G.y===before){ AUTO=null; return; }               // 没走动（被挡），停
      AUTO.timer=setTimeout(step, Math.max(40, 110/SET.speed)); }
  };
  step();
}
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(); const x=Math.floor((e.clientX-r.left)/r.width*N), y=Math.floor((e.clientY-r.top)/r.height*N);
  autoGo(x,y);
});
window.addEventListener('keydown',e=>{ if (KEYS[e.key]) stopAuto(); }, true);
document.getElementById('dpad').addEventListener('click',()=>stopAuto(), true);
// ───────────── 存档 ─────────────
const SAVE_KEY='mota-worlds-save-v2';
function save(auto){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); if(!auto) log('已存档。'); }catch(e){ if(!auto) log('这个浏览器不允许存档。'); } }
function load(){ if(BATTLE) return; try{ const s=localStorage.getItem(SAVE_KEY); if(!s){ log('没有存档。'); return; } G=JSON.parse(s); fixHero(); log('读取了存档。'); render(); }catch(e){ log('读档失败。'); } }
function eqIcon(e,slot){ const k=slot==='sword'?(e&&e.base>=80?'silverS':'S'):slot==='shield'?(e&&e.base>=80?'silverT':'T'):slot; const im=spriteImg(k); return im?`<img src="${im.src}" alt="">`:''; }
function openBag(tab){
  const h=G.hero; overlay.innerHTML=''; const d=document.createElement('div'); d.className='dialog bag';
  const slotRow = k => { const e=h.equip[k]; const sl=SLOTS[k];
    return `<div class="eq ${e?'q'+e.q:''}"><span class="sl">${eqIcon(e,k)}${sl.name}<small>≤Lv${maxLvl(k)}</small></span>${e?`<span class="nm" style="color:${QUAL[e.q].c}">${eqLabel(e)}</span><span class="ops"><button data-up="${e.id}" class="mini">升级 ${upgradeCost(e).gold}金+${upgradeCost(e).ess}精华</button></span>`:'<span class="nm dim">未装备</span>'}</div>`; };
  const bagRow = e => { const sl=SLOTS[e.slot]; const cur=h.equip[e.slot]; const better=!cur||eqValue(e)>eqValue(cur);
    return `<div class="eq q${e.q}"><span class="sl">${eqIcon(e,e.slot)}${sl.name}</span><span class="nm" style="color:${QUAL[e.q].c}">${eqLabel(e)}${better?' <i>↑</i>':''}</span><span class="ops"><button data-eq="${e.id}" class="mini">装备</button><button data-up="${e.id}" class="mini">升级</button><button data-smelt="${e.id}" class="mini">熔炼 +${smeltValue(e)}</button></span></div>`; };
  d.innerHTML=`<h3>背包</h3><p>金币 <b style="color:var(--brass)">${h.gold}</b> · 精华 <b style="color:#b86ae0">${h.essence}</b> · ${path()?`<b style="color:var(--brass)">${path().n}</b>：主线部位可升到 Lv${path().maxMain}，其余封顶见各栏`:`第 ${PATH_FLOOR} 层选择道路前所有部位封顶 Lv5`}；熔炼不要的装备得精华。</p>
    <div class="eqlist"><div class="sec">已装备</div>${Object.keys(SLOTS).map(slotRow).join('')}
    <div class="sec">背包（${h.bag.length}/30）</div>${h.bag.length?h.bag.map(bagRow).join(''):'<div class="dim" style="padding:4px 6px;font-size:12.5px">空。每个部位在固定楼层都有保底的基础款；击败怪物另有几率掉落随机品质的装备（标准：★1 3%，每升一星 +2%，Boss 必掉；可在设置里调整）。</div>'}</div>
    <div class="opts"><button class="btn primary" id="bagClose">关闭</button></div>`;
  d.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return;
    if (b.id==='bagClose'){ closeDialog(); return; }
    const find=id=>{ for(const k in h.equip) if(h.equip[k]&&h.equip[k].id==id) return h.equip[k]; return h.bag.find(x=>x.id==id); };
    if (b.dataset.eq){ const e=find(b.dataset.eq); const cur=h.equip[e.slot]; h.equip[e.slot]=e; h.bag=h.bag.filter(x=>x!==e); if(cur) h.bag.push(cur); log(`装备了${eqLabel(e)}。`); }
    if (b.dataset.up){ const e=find(b.dataset.up); const c=upgradeCost(e); if(e.lvl>=maxLvl(e.slot)){ log(`${eqName(e)}已到当前道路允许的上限 Lv${maxLvl(e.slot)}。`); } else if(h.gold<c.gold||h.essence<c.ess){ log(`升级需要 ${c.gold} 金和 ${c.ess} 精华。`); } else { h.gold-=c.gold; h.essence-=c.ess; e.lvl++; log(`${eqName(e)}升到 Lv${e.lvl}：${eqLabel(e).split('·')[1].trim()}。`,true); } }
    if (b.dataset.smelt){ const e=find(b.dataset.smelt); h.bag=h.bag.filter(x=>x!==e); h.essence+=smeltValue(e); log(`熔炼${eqName(e)}，获得 ${smeltValue(e)} 精华。`); }
    openBag();
  });
  overlay.appendChild(d); overlay.hidden=false; renderPanel();
}
document.getElementById('bagBtn').onclick=()=>{ if(overlay.hidden && !BATTLE) openBag(); };
function openFly(){
  if (G.floor>=HIDDEN_START){ log('隐藏楼层里无法使用传送卷轴。'); return; }
  const list=(G.visited||[]).filter(f=>f<HIDDEN_START && f!==G.floor).sort((a,b)=>b-a);
  if (!list.length){ log('还没有可以传送的楼层。'); return; }
  const opts=list.map(f=>[floorLabel(f), f===0?'序章':(f%10===0?'Boss 层':f%10===5?'商店层':''), ()=>{ const p=stairsOf(f,'<')||stairsOf(f,'>'); G.floor=f; if(p){ G.x=p.x; G.y=p.y; } log(`传送到${floorLabel(f)}。`,true); closeDialog(); save(true); }]);
  opts.push(['取消',null,null]);
  const d=document.createElement('div'); dialog('楼层传送', '只能前往去过的楼层，落在楼梯口。', opts);
  const o=overlay.querySelector('.opts'); if(o){ o.style.maxHeight='52vh'; o.style.overflow='auto'; }
}
document.getElementById('holyBtn').onclick=()=>{ const h=G.hero; if(overlay.hidden && !BATTLE && h.holy>0){ const g=Math.floor(h.hp*0.3); h.holy--; h.hp+=g; flashText(G.x,G.y,'+'+g,'#7fe39a'); log(`使用圣水：生命 +${g}（当前的 30%）。`,true); render(); } };
document.getElementById('flyBtn').onclick=()=>{ if(overlay.hidden && !BATTLE && G.hero.fly) openFly(); };
function openSettings(){
  dialog('设置','战斗动画会演示每回合的攻防与掉血；关闭后战斗立即结算。装备掉落“标准”为 ★1 3%、每星 +2%，Boss 必掉；“稀少”减半，“丰富”为 2.5 倍。',[
    [`战斗动画：${SET.anim?'开':'关'}`, '切换', ()=>{ SET.anim=!SET.anim; saveSettings(); openSettings(); }],
    [`动画速度：${SET.speed===1?'正常':SET.speed===2?'快':'很快'}`, '切换', ()=>{ SET.speed=SET.speed===1?2:SET.speed===2?3:1; saveSettings(); openSettings(); }, !SET.anim],
    [`装备掉落：${(DROP_MODES[SET.drop]||DROP_MODES.normal).n}`, '切换', ()=>{ const ks=Object.keys(DROP_MODES); SET.drop=ks[(ks.indexOf(SET.drop)+1)%ks.length]; saveSettings(); openSettings(); render(); }],
    [`测试模式：${G.test?'开':'关'}`, '秒杀 · 无限钥匙 · 跳层', ()=>{ toggleTest(); openSettings(); }],
    ['完成', null, null],
  ]);
}
function toggleTest(){
  const h=G.hero;
  if (!G.test){ G.test={...h}; Object.assign(h,{hp:999999,atk:99999,def:99999,ykey:99,bkey:99,rkey:99,manual:1}); log('测试模式开启：秒杀所有怪物，钥匙无限，可用按钮跳层。',true); }
  else { Object.assign(h, G.test); G.test=null; log('测试模式关闭，属性已恢复。'); }
  render();
}
function jumpFloor(d){
  const nf=G.floor+d;  // 测试模式可一路跳到隐藏层与宝库 if (nf<0||nf>=G.maps.length||BATTLE) return;
  const p = stairsOf(nf, d>0?'<':'>') || stairsOf(nf, d>0?'>':'<');
  G.floor=nf; if (p){ G.x=p.x; G.y=p.y; }
  if (nf===ARENA && !G.arena) setupArena(false);
  G.maxFloor=Math.max(G.maxFloor,G.floor); log(`跳到${floorLabel(nf)}。`); render();
}
document.getElementById('floorUp').onclick=()=>jumpFloor(1);
document.getElementById('floorDown').onclick=()=>jumpFloor(-1);
document.getElementById('setBtn').onclick=()=>{ if(overlay.hidden && !BATTLE) openSettings(); };
document.getElementById('saveBtn').onclick=()=>save(false);
document.getElementById('loadBtn').onclick=load;
document.getElementById('resetBtn').onclick=()=>{ if(!overlay.hidden||BATTLE) return; dialog('重新开始？','当前进度会丢失（存档不受影响）。',[['选择世界并重新开始',null,()=>{chooseWorld();}],['取消',null,null]]); };

// ───────────── 启动（含热更新保留进度）─────────────
const MAP_VERSION = 28;   // 地图数据版本：升级时把存档里未到过的楼层换成新图，到过的楼层补上新增道具
function migrateMaps(){
  if (G.mapVersion === MAP_VERSION) return;
  const W=worldOf(); if (!W.maps) return; let patched=0;
  if ((G.mapVersion||0) < 17){   // 新增序章（第 0 层）：所有楼层下标 +1；旧版隐藏层一并重置
    const shift = o => { const r={}; for (const k in o){ const m=/^(\d+)(.*)$/.exec(k); r[m?(+m[1]+1)+m[2]:k]=o[k]; } return r; };
    G.maps = G.maps.slice(0,51); G.maps.unshift(W.maps[0].map(r=>r.split('')));
    G.floor = G.floor>=51 ? 40 : G.floor+1; G.maxFloor=Math.min(50,(G.maxFloor||0)+1);
    G.shopBought=shift(G.shopBought||{}); G.cracks=shift(G.cracks||{}); G.plates=shift(G.plates||{}); G.arena=null; G.intro=true;
    for (let f=HIDDEN_START; f<W.maps.length; f++) G.maps[f]=W.maps[f].map(r=>r.split(''));
    const p=stairsOf(G.floor,'<')||stairsOf(G.floor,'>'); if (p && G.maps[G.floor][G.y] && '#$'.includes(G.maps[G.floor][G.y][G.x]||'#')){ G.x=p.x; G.y=p.y; }
  }
  W.maps.forEach((rows,f)=>{
    const fresh=rows.map(r=>r.split(''));
    if (f > (G.maxFloor||0)) { G.maps[f]=fresh; patched++; return; }
    const old=G.maps[f]; if(!old) { G.maps[f]=fresh; return; }
    if (rows.some(r=>r.includes('$'))){   // 商店楼层：按新图重排，已拿走的东西保持为空地
      for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (old[y][x]==='.' && !'#$'.includes(fresh[y][x])) fresh[y][x]='.';
      G.maps[f]=fresh; patched++;
      if (G.floor===f && '#$'.includes(fresh[G.y][G.x])){ const p=stairsOf(f,'<')||stairsOf(f,'>'); if(p){ G.x=p.x; G.y=p.y; } }
      return;
    }
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      if ('345m9780o6!%&*'.includes(fresh[y][x]) && old[y][x]==='.') { old[y][x]=fresh[y][x]; patched++; }
      if (fresh[y][x]==='6' && old[y][x]==='#') { old[y][x]='6'; patched++; }
      if (fresh[y][x]==='.' && old[y][x]==='#') { old[y][x]='.'; patched++; }          // 新版打通的通道（如商店门口）
      if (fresh[y][x]==='$' && old[y][x]==='#') { old[y][x]='$'; patched++; }          // 商店扩大占格
    }
  });
  G.mapVersion = MAP_VERSION; if (patched) log('地图已更新到新版本：未到过的楼层换成了新布局，到过的楼层补上了新道具。');
}
function visit(f){ if(!G.visited) G.visited=[]; if(!G.visited.includes(f)) G.visited.push(f); }
function fixHero(){ if(!G.diff) G.diff='normal'; applyDifficulty(); migrateMaps(); if(!G.cracks) G.cracks={}; if(!G.plates) G.plates={}; if(!G.visited){ G.visited=[]; for(let f=0;f<=Math.min(50,G.maxFloor||0);f++) G.visited.push(f); } if(G.hero.fly==null) G.hero.fly=G.intro?1:0; if(G.hero.holy==null) G.hero.holy=0; if(G.arena) setupArena(false); const h=G.hero; if(!h.equip) h.equip={sword:null,shield:null,boots:null,hat:null,ring:null}; if(!h.bag) h.bag=[]; if(h.essence==null) h.essence=0; let mx=0; for(const e of [...h.bag,...Object.values(h.equip)]) if(e) mx=Math.max(mx,e.id); _eqId=mx+1; }
function start(data){ if (data && data.G && data.G.maps && data.G.world) G=data.G; else newGame('tower'); fixHero(); loadSprites(()=>{ render(); if(!G.intro) setTimeout(()=>openElder(0), 400); }); }
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({G}));
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(start) : start(window.claude && window.claude.hot ? window.claude.hot.data : null);
</script>
