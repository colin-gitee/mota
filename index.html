<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>
</head>
<body>
<title>五界魔塔</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: a stone tower frame — status scroll on the left, the 11x11 dungeon in the middle, the monster manual & log on the right; all stacks on a phone. Single dark dungeon theme by choice. */
:root{
  --ink:#0e0c12;        /* deep dungeon night */
  --stone:#1d1a24;      /* panel stone */
  --stone-2:#2a2633;    /* raised stone */
  --line:#4a4356;       /* mortar */
  --parchment:#e8dcc0;  /* body text */
  --dim:#9d93a8;        /* secondary text */
  --brass:#d8a94a;      /* accent: brass / torchlight */
  --blood:#c9433b;      /* hp / danger */
  --mana:#4f8fd6;       /* blue keys & gems */
  --moss:#5ca864;       /* good */
  --display:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;
  --body:'Noto Sans SC',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--parchment);font-family:var(--body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:14px 24px;
  background-image:radial-gradient(ellipse at 50% 0%,#2b2236 0%,var(--ink) 60%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;letter-spacing:.06em;color:var(--brass);text-shadow:0 0 18px rgba(216,169,74,.25)}
h1 small{font-size:14px;color:var(--dim);letter-spacing:.2em;margin-left:10px;font-family:var(--body)}
.hint{color:var(--dim);font-size:12.5px}
.board{display:grid;grid-template-columns:200px auto 230px;gap:12px;align-items:start}
.panel{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:12px}
.panel h2{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.18em;color:var(--brass);margin:0 0 8px;text-transform:uppercase}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.stat dt{color:var(--dim)} .stat dd{margin:0;text-align:right;font-family:var(--mono);font-size:14px}
.stat dd small{color:var(--dim);font-size:11px;margin-left:3px}
.stat dd.hp{color:#ff8a7a} .stat dd.atk{color:#f0c674} .stat dd.def{color:#8fc1ff} .stat dd.gold{color:var(--brass)}
.keys{display:flex;gap:8px;margin-top:10px}
.key{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:var(--stone-2);border-radius:4px;font-family:var(--mono);font-size:14px}
.key img{display:block;width:28px;height:28px}
.floorTag{font-family:var(--display);font-size:26px;color:var(--parchment);letter-spacing:.1em;text-align:center;margin:2px 0 8px}
.floorTag span{color:var(--brass)}
.stage{position:relative;justify-self:center;width:100%;max-width:528px}
canvas#map{display:block;width:100%;aspect-ratio:1/1;border:4px solid #3a3346;border-radius:4px;background:#111;box-shadow:0 0 0 1px #000,0 10px 40px rgba(0,0,0,.6)}
.overlay{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.84);border-radius:2px}
.dialog{background:var(--stone);border:1px solid var(--brass);border-radius:6px;padding:18px 20px;max-width:360px;width:90%;box-shadow:0 10px 40px #000}
.dialog h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 6px;color:var(--brass);letter-spacing:.1em}
.dialog p{margin:0 0 12px;color:var(--parchment)}
.dialog .opts{display:flex;flex-direction:column;gap:6px}
.btn{background:var(--stone-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;text-align:left;display:flex;justify-content:space-between;gap:8px}
.btn:hover{border-color:var(--brass)} .btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{border-color:var(--brass);color:var(--brass);justify-content:center}
.btn b{font-family:var(--mono);font-weight:400;color:var(--brass)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dialog.bag{max-width:440px;max-height:90%;overflow:auto}
.eqlist{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.bagHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px} .bagHead h3{margin:0}
.tabs{display:flex;gap:4px} .tabs .tab{padding:4px 10px} .tabs .tab.cur{background:var(--brass);color:#1a1522;border-color:var(--brass)}
.res{font-size:12.5px;color:var(--dim);margin-bottom:8px}
.bag .sec{font-family:var(--display);letter-spacing:.15em;color:var(--brass);font-size:13px;margin:8px 0 4px}
.cards{display:grid;grid-template-columns:1fr;gap:6px}
.card{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:8px;background:var(--stone-2);border-radius:6px;border:1px solid var(--line);border-left-width:4px}
.card.on{border-color:var(--brass);background:linear-gradient(90deg,rgba(216,169,74,.12),transparent 60%),var(--stone-2)}
.card.empty{opacity:.7;border-style:dashed}
.card.q1{border-left-color:#e6e9ef}.card.q2{border-left-color:#6cc46f}.card.q3{border-left-color:#5a9df0}.card.q4{border-left-color:#b86ae0}.card.q5{border-left-color:#f2cf4e}
.card .ic img{width:40px;height:40px;display:block}
.card .nm{font-size:13.5px;font-weight:700} .card .nm .lv{font-family:var(--mono);font-weight:400;color:var(--dim);font-size:11.5px;margin-left:4px}
.card .nm i.up{font-style:normal;color:var(--moss);font-size:11px;margin-left:6px;font-weight:400}
.card .st{font-size:12.5px;color:var(--parchment);margin-top:2px} .card .st b{color:var(--brass);font-weight:700}
.card .ops{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px} .mini.warn{border-color:#6a3a3a} .mini:disabled{opacity:.4;cursor:not-allowed}
.dialog.dex{max-width:560px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.dexc{background:var(--stone-2);border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center}
.dexc.elite{border-color:#ffd34d} .dexc.boss{border-color:#ff5a2a}
.dexc img{width:48px;height:48px;display:block;margin:0 auto 2px}
.dexc .dn{font-size:12.5px;font-weight:700} .dexc .ds{font-size:10px} .dexc .dd{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.35;margin-top:2px}
.rules{font-size:12.5px;line-height:1.6} .rules p{margin:0 0 8px} .rules b{color:var(--brass)}
.eqlist .sec{font-family:var(--display);letter-spacing:.15em;color:var(--brass);font-size:13px;margin-top:6px}
.eq{display:grid;grid-template-columns:40px 1fr;gap:4px 8px;align-items:center;padding:5px 6px;background:var(--stone-2);border-radius:4px;border-left:3px solid var(--line);font-size:12.5px}
.eq.q2{border-left-color:#6cc46f}.eq.q3{border-left-color:#5a9df0}.eq.q4{border-left-color:#b86ae0}.eq.q5{border-left-color:#f2cf4e}
.eq .sl{color:var(--dim);display:flex;flex-direction:column;align-items:center;font-size:11px} .eq .sl small{font-size:9.5px;opacity:.8} .eq .sl img{width:26px;height:26px;display:block} .eq .nm i{font-style:normal;color:var(--moss)} .eq .dim,.dim{color:var(--dim)}
.eq .ops{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.mini{background:var(--stone);border:1px solid var(--line);border-radius:3px;padding:2px 7px;font-size:11.5px}
.mini:hover{border-color:var(--brass)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;margin:4px 0}
.jgrid .jf{padding:4px 2px;text-align:center;font-family:var(--mono);white-space:normal;line-height:1.2} .jgrid .jf.cur{border-color:var(--brass);color:var(--brass)} .jgrid .wt{padding:6px 2px;text-align:center} .jgrid .wt.cur{background:var(--brass);color:#1a1522;border-color:var(--brass)}
.toolbar .btn{padding:5px 9px;font-size:12.5px}
.toolbar .btn.big{flex:1 1 100%;padding:10px 12px;font-size:15px;letter-spacing:.2em;font-family:var(--display)}
.dpad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px;justify-content:center;margin-top:10px;user-select:none;-webkit-user-select:none}
.dpad button{background:var(--stone-2);border:1px solid var(--line);border-radius:6px;font-size:22px;touch-action:manipulation}
.dpad button:active{background:var(--line)}
.manual{display:flex;flex-direction:column;gap:6px}
.mon{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;padding:5px 6px;background:var(--stone-2);border-radius:4px}
.mon img{width:34px;height:34px;display:block}
.mon .n{font-size:13px} .mon .s{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.mon .d{font-family:var(--mono);font-size:12px}
.stars{color:#ffd34d;font-size:11px;letter-spacing:-1px} .stars.boss{color:#ff5a2a} .d.ok{color:var(--moss)} .d.warn{color:var(--brass)} .d.bad{color:#ff8a7a}
.items{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.it{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;padding:2px 4px}
.it img{width:24px;height:24px;display:block;object-fit:contain}
.toast{position:absolute;z-index:4;left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(20,16,28,.96);border:1px solid var(--brass);border-radius:8px;padding:8px 14px 8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;max-width:92%;animation:toastIn .25s ease-out}
.toast img{width:40px;height:40px;display:block;flex:none}
.toast .t1{font-size:11px;letter-spacing:.15em;color:var(--dim)} .toast .t2{font-size:14px;font-weight:700} .toast .t3{font-size:12px;color:var(--parchment)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.target{position:absolute;z-index:5;width:220px;background:rgba(20,16,28,.97);border:1px solid var(--brass);border-radius:8px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:12.5px;line-height:1.45}
.target .tt{font-size:14px;color:var(--brass)} .target .ts{font-family:var(--mono);font-size:11px;color:var(--dim);margin:3px 0} .target .td i{font-style:normal;color:var(--moss)} .target .td i.warn{color:var(--brass)} .target .td i.bad{color:#ff8a7a}
.target .tb{display:flex;gap:6px;margin-top:8px} .target .tb .btn{flex:1;justify-content:center;padding:6px 8px}
.tip{position:absolute;z-index:3;pointer-events:none;background:rgba(20,16,28,.95);border:1px solid var(--brass);border-radius:5px;padding:7px 10px;font-size:12.5px;line-height:1.45;max-width:170px;color:var(--parchment);box-shadow:0 6px 20px rgba(0,0,0,.5)}
.tip b{color:var(--brass);font-weight:700} .tip i{font-style:normal;color:var(--moss)} .tip i.bad{color:#ff8a7a}
.log{margin-top:10px;font-size:12.5px;color:var(--dim);max-height:150px;overflow:auto;display:flex;flex-direction:column-reverse;gap:2px}
.log .new{color:var(--parchment)}
.legend{margin-top:10px;font-size:12px;color:var(--dim);line-height:1.6}
@media (max-width:860px){
  .board{grid-template-columns:1fr 1fr}
  .stage{grid-column:1 / -1;order:-1}
}
@media (max-width:560px){
  .board{grid-template-columns:1fr}
  h1{font-size:28px}
}
/* 手机横屏：地图固定在中间并占满高度，左右两栏各自滚动 */
@media (orientation:landscape) and (max-height:560px) and (pointer:coarse){
  body{padding-inline:8px;padding-block:4px 4px}
  .app{gap:4px}
  header{display:none}
  .board{grid-template-columns:minmax(140px,1fr) auto minmax(160px,1fr);gap:8px;height:calc(100dvh - 8px);align-items:stretch}
  .stage{order:0;grid-column:auto;align-self:center;width:auto;max-width:none;height:calc(100dvh - 8px);aspect-ratio:1/1}
  canvas#map{height:100%;width:auto;aspect-ratio:1/1;border-width:3px}
  .panel{overflow:auto;height:100%;padding:8px;font-size:12px;-webkit-overflow-scrolling:touch}
  .floorTag{font-size:18px;margin:0 0 4px} .panel h2{font-size:13px;margin:0 0 4px}
  .stat dd{font-size:12px} .toolbar .btn{padding:3px 6px;font-size:11px} .legend{display:none}
  .log{max-height:none}
}

<div class="app">
  <header>
    <h1><span id="worldName">魔塔</span><small id="worldSub">MAGIC TOWER · 51F</small></h1>
    <div class="hint">点击任意格子自动走过去（点怪物即战斗、点门即开门）· 也可用方向键 / WASD · B 背包 · F 传送 · 悬停查看说明</div>
  </header>

  <div class="board">
    <section class="panel" aria-label="勇士状态">
      <div class="floorTag"><span id="floorPre">第 </span><span id="floorNo">1</span><span id="floorSuf"> 层</span></div>
      <h2>勇士</h2>
      <dl class="stat">
        <dt>等级</dt><dd id="lvl">1</dd>
        <dt>生命</dt><dd class="hp" id="hp">1000</dd>
        <dt>攻击</dt><dd class="atk" id="atk">10</dd>
        <dt>防御</dt><dd class="def" id="def">10</dd>
        <dt>暴击</dt><dd id="crit">0%</dd>
        <dt>闪避</dt><dd id="dodge">0%</dd>
        <dt>吸血</dt><dd id="steal">0%</dd>
        <dt>金币</dt><dd class="gold" id="gold">0</dd>
        <dt>经验</dt><dd id="exp">0</dd>
        <dt>升级还需</dt><dd id="need">80</dd>
      </dl>
      <div class="keys">
        <div class="key y"><img id="ykeyImg" alt="黄钥匙"><span id="ykey">1</span></div>
        <div class="key b"><img id="bkeyImg" alt="蓝钥匙"><span id="bkey">0</span></div>
        <div class="key r"><img id="rkeyImg" alt="红钥匙"><span id="rkey">0</span></div>
      </div>
      <div class="toolbar">
        <button class="btn primary big" id="flyBtn" hidden>传送</button>
        <button class="btn primary" id="bagBtn">背包</button>
        <button class="btn" id="dexBtn">图鉴</button>
        <button class="btn" id="saveBtn">存档</button>
        <button class="btn" id="loadBtn">读档</button>
        <button class="btn" id="resetBtn">重新开始</button>
        <button class="btn" id="setBtn">设置</button>
      </div>
      <div class="toolbar" id="testBar" hidden>
        <span style="color:var(--blood);font-size:12px;align-self:center">测试模式：传送可去任意楼层，重新开始可选任意世界</span>
      </div>
      <div class="legend">
        每升一级：生命与攻防提升，等级越高提升越多。<br>怪物头顶的 ★ 是其种族星级（1~5），星越多越强。<br>
        战斗公式：你每回合造成 攻−怪防，怪物造成 怪攻−你防，你先手。
      </div>
    </section>

    <div class="stage">
      <canvas id="map" width="528" height="528" aria-label="塔内地图"></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <div class="target" id="target" hidden></div>
      <div class="overlay" id="overlay" hidden></div>
      <div class="dpad" id="dpad">
        <span></span><button data-d="0,-1" aria-label="上">▲</button><span></span>
        <button data-d="-1,0" aria-label="左">◀</button><span></span><button data-d="1,0" aria-label="右">▶</button>
        <span></span><button data-d="0,1" aria-label="下">▼</button><span></span>
      </div>
    </div>

    <section class="panel" aria-label="怪物手册">
      <h2>怪物手册 <span id="monCount" style="font-family:var(--mono);font-size:12px;letter-spacing:0;color:var(--dim)"></span></h2>
      <div class="manual" id="manual"></div>
      <h2 style="margin-top:14px">本层图鉴</h2>
      <div class="items" id="legend"></div>
      <div class="log" id="log"></div>
    </section>
  </div>
</div>

function battleInfo(ch){
  const m=MON[ch], h=G.hero;
  const atk=effAtk(), def=effDef(), c=critP(), dg=dodgeP(), ls=stealP();
  const hd = atk - m.def; if (hd<=0) return {ok:false, dmg:Infinity, worst:Infinity, turns:Infinity};
  const turnsW = Math.ceil(m.hp/hd), md = Math.max(0, m.atk - def);
  const worst = (turnsW-1)*md;
  const turnsE = Math.ceil(m.hp/(hd*(1+c*(critMul()-1))));
  const heal = Math.round(Math.min(m.hp, hd*(1+c*(critMul()-1))*turnsE)*ls);
  const dmg = Math.max(0, Math.round((turnsE-1)*md*(1-dg) - heal));
  return {ok:true, dmg, worst, turns:turnsE, md, hd, c, dg, ls};
}
// 实际结算：逐回合掷骰，返回回合记录
function simulate(ch){
  const m=MON[ch], h=G.hero; const atk=effAtk(), def=effDef(), c=critP(), dg=dodgeP(), ls=stealP();
  const hd=atk-m.def, md=Math.max(0,m.atk-def); let mhp=m.hp, taken=0, healed=0; const rounds=[];
  for (let t=0;t<999 && mhp>0;t++){
    const crit=Math.random()<c; const dealt=Math.min(mhp, Math.round(hd*(crit?critMul():1))); mhp-=dealt; const hl=Math.round(dealt*ls); healed+=hl;
    let got=0, miss=false; if (mhp>0){ miss=Math.random()<dg; got=miss?0:Math.round(md); taken+=got; }
    rounds.push({dealt,crit,taken:got,miss,heal:hl,mhp});
  }
  return {rounds, taken:Math.round(taken), healed:Math.round(healed), net:Math.round(taken-healed)};
}

// 色相偏移版本（怪物变体），离屏画布逐像素旋转色相后缓存
const TINT = {};
function tinted(key, hue, tint){
  if (!hue && !tint) return IMG[key];
  const id=key+'@'+hue+(tint?tint[0]+tint[1]:''); if (TINT[id]) return TINT[id];
  const base=IMG[key]; if(!base||!base.complete||!base.naturalWidth) return base;
  const c=document.createElement('canvas'); c.width=c.height=96; const x=c.getContext('2d'); x.drawImage(base,0,0,96,96);
  const img=x.getImageData(0,0,96,96), p=img.data, rad=-hue*Math.PI/180, cs=Math.cos(rad), sn=Math.sin(rad);   // 负号：让 +hue 按色环正向（绿→蓝）旋转
  // YIQ 色相旋转矩阵
  const m=[0.299+0.701*cs+0.168*sn, 0.587-0.587*cs+0.330*sn, 0.114-0.114*cs-0.497*sn,
           0.299-0.299*cs-0.328*sn, 0.587+0.413*cs+0.035*sn, 0.114-0.114*cs+0.292*sn,
           0.299-0.300*cs+1.250*sn, 0.587-0.588*cs-1.050*sn, 0.114+0.886*cs-0.203*sn];
  for (let i=0;i<p.length;i+=4){ const r=p[i],g=p[i+1],b=p[i+2];
    // 皮肤色与描边不旋转（低饱和或接近肤色），其余旋转
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b); if (mx-mn<40) continue; if (r>200&&g>150&&b>120&&r>g&&g>b) continue;
    if (hue){ p[i]=Math.min(255,Math.max(0,r*m[0]+g*m[1]+b*m[2])); p[i+1]=Math.min(255,Math.max(0,r*m[3]+g*m[4]+b*m[5])); p[i+2]=Math.min(255,Math.max(0,r*m[6]+g*m[7]+b*m[8])); } }
  if (tint){ const tc=parseInt(tint[0].slice(1),16), tr=(tc>>16)&255, tg=(tc>>8)&255, tb=tc&255, a=tint[1];
    for (let i=0;i<p.length;i+=4){ if (p[i+3]<40) continue; const r=p[i],g=p[i+1],b=p[i+2]; if (r+g+b<90) continue;             // 描边不染
      if (r>200&&g>150&&b>120&&r>g&&g>b) continue;                                                                               // 皮肤不染
      p[i]=r*(1-a)+tr*a; p[i+1]=g*(1-a)+tg*a; p[i+2]=b*(1-a)+tb*a; } }
  x.putImageData(img,0,0); return TINT[id]=c;
}

    ctx.closePath(); ctx.fill(); ctx.stroke(); }

let G; // game state
const defaultHero = () => ({hp:1000,atk:10,def:10,gold:0,exp:0,lvl:1,ykey:1,bkey:0,rkey:0,manual:0,holy:0,equip:{sword:null,shield:null,boots:null,hat:null,ring:null},bag:[],essence:0});
// 一名勇士贯穿五界：每界的地图/机关/足迹存在 G.worlds[id]，当前世界的字段挂在 G 上（同一引用）
const WORLD_FIELDS = ['maps','floor','x','y','shopBought','cracks','plates','visited','arena','maxFloor','intro'];
function freshWorldState(wid){
  const W = WORLDS.find(w=>w.id===wid) || WORLDS[0];
  const maps = W.maps.map(rows=>rows.map(r=>r.split('')));
  let pos={x:5,y:9}; maps[0].forEach((r,y)=>r.forEach((c,x)=>{ if(c==='@'){pos={x,y}; r[x]='.';} }));
  return {maps, floor:0, x:pos.x, y:pos.y, shopBought:{}, cracks:{}, plates:{}, visited:[0], arena:null, maxFloor:0, intro:false};
}
function bindWorld(wid){           // 把 G.worlds[wid] 的字段挂到 G 上
  if (!G.worlds) G.worlds={};
  if (!G.worlds[wid]) G.worlds[wid]=freshWorldState(wid);
  const st=G.worlds[wid]; G.world=wid; for (const k of WORLD_FIELDS) G[k]=st[k];
}
function syncWorld(){               // 把 G 上的字段写回 G.worlds[G.world]（数组/对象是同一引用，这里只补标量）
  if (!G.worlds || !G.worlds[G.world]) return; const st=G.worlds[G.world]; for (const k of WORLD_FIELDS) st[k]=G[k];

function newGame(worldId='tower', diff='normal'){
  G = {world:worldId, diff, mapVersion:MAP_VERSION, worlds:{}, hero:defaultHero(), log:[], won:false, dead:false};
  bindWorld(worldId); setWorldData(worldId);
  const W=worldOf(); log(`${W.name}·序章（${DIFFS[diff].n}难度）。先听长老说完，再上楼。`);
}
const START_A = k => 10*Math.pow(5,k), START_H = k => 1000*Math.pow(5,k);   // 各界起点（境界压制后的基准）
// ───────────── 各界分身：每一界有自己的一副“身体”（攻防生命等级经验金币），跨界时存起来，回来时恢复 ─────────────
const BODY_FIELDS = ['atk','def','hp','lvl','exp','gold'];
function saveBody(wid){ if(!G.worlds||!G.worlds[wid]) return; const b={}; for(const k of BODY_FIELDS) b[k]=G.hero[k]; G.worlds[wid].body=b; }
function loadBody(wid){ const b=G.worlds&&G.worlds[wid]&&G.worlds[wid].body; if(!b) return false; for(const k of BODY_FIELDS) G.hero[k]=b[k]; return true; }
function eqBaseIn(e, k){   /* 剑盾在第 k 界的基础值：从出产界 wk0 带到更高一界按 1/5 折算（再高一界按 1/25），带回更低一界按该界尺度缩小 */
  const wk0 = e.wk0==null ? k : e.wk0, b0 = e.base0==null ? e.base : e.base0; const d=k-wk0;
  const fac = d>0 ? Math.pow(5,d)/25 : Math.pow(5,d);
  return Math.max(0.01, Math.round(b0*fac*100)/100);
}
function rescaleEquip(toK){ const h=G.hero; for (const e of [...h.bag, ...Object.values(h.equip)]) if (e && (e.slot==='sword'||e.slot==='shield')){ if(e.wk0==null){ e.wk0=toK; e.base0=e.base; } e.base=eqBaseIn(e,toK); } }
function suppress(fromK, toK){     // 境界压制：首次进入更高一界时，把属性收束到该界起点附近（按上一界的完成度浮动 0.7~1.5 倍）
  const h=G.hero; const before={atk:h.atk, def:h.def, hp:h.hp};
  const Wf=WORLDS[fromK]; const endA=(Wf.end&&Wf.end.atk)||START_A(fromK)*120, endD=(Wf.end&&Wf.end.def_)||endA, endH=(Wf.end&&Wf.end.hp)||START_H(fromK)*10;
  const ra=Math.min(1.5,Math.max(0.7,h.atk/endA)), rd=Math.min(1.5,Math.max(0.7,h.def/endD)), rh=Math.min(1.5,Math.max(0.5,h.hp/endH));
  h.atk=Math.round(START_A(toK)*ra); h.def=Math.round(START_A(toK)*rd); h.hp=Math.round(START_H(toK)*rh);
  h.lvl=1; h.exp=0; h.gold=Math.min(h.gold, 300);
  return before;
}
function switchWorld(wid, toFloor){   // 跨界传送：首次进入更高一界受境界压制；回到去过的界则恢复那一界的身体
  syncWorld(); saveBody(G.world); const fromK=WORLD_ORDER.indexOf(G.world), toK=WORLD_ORDER.indexOf(wid);
  const h=G.hero; const hadBody=!!(G.worlds&&G.worlds[wid]&&G.worlds[wid].body); const first=!(G.worlds&&G.worlds[wid]);
  let before=null, restored=null;
  if (hadBody){ restored={atk:h.atk, def:h.def, hp:h.hp}; loadBody(wid); }
  else if (toK>fromK) before=suppress(fromK,toK);
  else if (toK<fromK){ const f=Math.pow(5,toK-fromK); h.atk=Math.max(START_A(toK),Math.round(h.atk*f)); h.def=Math.max(START_A(toK),Math.round(h.def*f)); h.hp=Math.max(START_H(toK),Math.round(h.hp*f)); h.lvl=1; h.exp=0; }
  bindWorld(wid); setWorldData(wid); rescaleEquip(toK); saveBody(wid);
  if (before){ setTimeout(()=>dialog('境界压制', `踏入${worldOf().name}的一瞬，天地法则压下来：你的力量被收束到这一界的尺度。<br><br>攻击 ${fmt(before.atk)} → <b style="color:var(--brass)">${fmt(h.atk)}</b><br>防御 ${fmt(before.def)} → <b style="color:var(--brass)">${fmt(h.def)}</b><br>生命 ${fmt(before.hp)} → <b style="color:var(--brass)">${fmt(h.hp)}</b><br><br>上一界打得越漂亮，起点越高（0.7~1.5 倍）。旧界的剑盾按五分之一折算，饰品的百分比不变；精华、钥匙、背包保留，金币最多带 300。<br><br>放心：每一界的身体都会单独记住——回到低一界时，你会恢复在那里的全部实力。`, [['明白',null,()=>{ closeDialog(); if(!G.intro) openElder(0); }]]), 200); }
  else if (restored && (restored.atk!==h.atk || restored.hp!==h.hp)) { const up = toK>fromK; setTimeout(()=>dialog(up?'境界恢复':'境界解封', `回到${worldOf().name}，你在这一界的身体醒了过来。<br><br>攻击 ${fmt(restored.atk)} → <b style="color:var(--brass)">${fmt(h.atk)}</b><br>防御 ${fmt(restored.def)} → <b style="color:var(--brass)">${fmt(h.def)}</b><br>生命 ${fmt(restored.hp)} → <b style="color:var(--brass)">${fmt(h.hp)}</b><br>等级 Lv${h.lvl}`, [['继续',null,closeDialog]]), 200); }
  if (toFloor!=null){ G.floor=toFloor; const p=stairsOf(toFloor,'<')||stairsOf(toFloor,'>')||stairsOf(toFloor,'@'); if(p){ G.x=p.x; G.y=p.y; } }
  const W=worldOf(); log(`来到${W.name}·${floorLabel(G.floor)}。`,true); visit(G.floor);
  if (!G.intro && !before) setTimeout(()=>openElder(0), 300);
  save(true); render();
}

  while (h.exp >= needExp(h.lvl)){ const g=levelGain(h.lvl); h.lvl++; h.hp+=g.hp; h.atk+=g.atk; h.def+=g.def; log(`升到了 ${h.lvl} 级！生命 +${g.hp}，攻防 +${g.atk}。`,true); }
}

  else if (ch==='<') { if(G.floor===0){ render(); return; } const p=stairsOf(G.floor-1,'>'); G.floor--; G.x=p.x; G.y=p.y; log(`回到${floorLabel(G.floor)}。`); }

function playBattle(mx,my,ch,sim,done){
  const mo=MON[ch], h=G.hero;

  const all=sim.rounds, shown=Math.min(all.length,6), per=Math.ceil(all.length/shown);
  const rounds=[]; let hhp=h.hp;
  for(let i=0;i<shown;i++){

    const dealt=seg.reduce((a,r)=>a+r.dealt,0), taken=seg.reduce((a,r)=>a+r.taken,0), heal=seg.reduce((a,r)=>a+r.heal,0);

function stepBattle(now){
  const B=BATTLE; const per=B.dur/B.rounds.length; const t=now-B.t0;

  // 触发到 idx 之前的回合结算（飘字 + 血条）
  while (B.fired<idx){ const r=B.rounds[B.fired]; B.mhp=r.mhp; B.hhp=r.hhp;
    B.floats.push({x:B.mx,y:B.my,text:(r.crit?'暴击 ':'')+'-'+r.dealt,color:r.crit?'#ff9d3a':'#ffe28a',t:now});
    if (r.taken>0) B.floats.push({x:G.x,y:G.y,text:'-'+r.taken,color:'#ff7b7b',t:now+90});
    else if (r.miss) B.floats.push({x:G.x,y:G.y,text:'闪避',color:'#8fe3ff',t:now+90});
    if (r.heal>0) B.floats.push({x:G.x,y:G.y,text:'+'+r.heal,color:'#7fe39a',t:now+180});
    B.fired++; }
  const phase=(t%per)/per;               // 0..1 当前回合进度
  const lunge = phase<0.5 ? Math.sin(phase*2*Math.PI) : 0;           // 勇士前冲
  const mlunge = phase>=0.5 && B.mhp>0 ? Math.sin((phase-0.5)*2*Math.PI) : 0; // 怪物反击

function findPath(tx,ty){
  const m=G.maps[G.floor]; const start=[G.x,G.y]; const key=(x,y)=>y*N+x;
  const prev=new Map(); prev.set(key(G.x,G.y),-1); const q=[start];
  const target=m[ty][tx]; const goalIsPass=passable(target);
  while (q.length){
    const [x,y]=q.shift();
    if (goalIsPass && x===tx && y===ty) break;
    if (!goalIsPass && Math.abs(x-tx)+Math.abs(y-ty)===1) { prev.set(key(tx,ty), key(x,y)); break; }
    for (const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=N||ny>=N) continue;
      const k=key(nx,ny); if (prev.has(k)) continue; const c=m[ny][nx];
      if (!passable(c)) continue; prev.set(k,key(x,y)); q.push([nx,ny]); }
  }
  if (!prev.has(key(tx,ty))) return null;
  const path=[]; let k=key(tx,ty); while (k!==-1 && k!==key(G.x,G.y)){ path.push([k%N, Math.floor(k/N)]); k=prev.get(k); }
  return path.reverse();
}
function autoGo(tx,ty,force){

  };

}

    <div class="card"><div class="ic">${spriteImg('&')?`<img src="${spriteImg('&').src}" alt="">`:''}</div><div class="bd"><div class="nm">精华 <span class="lv">×${h.essence}</span></div><div class="st dim">装备升级材料，来自熔炼、精华袋、商店与试炼之间</div>
      <div class="st">兑换金币：1 精华 → <b>${essRate()}</b> 金（按当前楼层）</div>
      <div class="ops"><button class="mini" data-ex="1" ${h.essence>=1?'':'disabled'}>换 1</button><button class="mini" data-ex="10" ${h.essence>=10?'':'disabled'}>换 10</button><button class="mini" data-ex="all" ${h.essence>=1?'':'disabled'}>全部兑换</button></div></div></div>`;
  const rules = `<div class="rules">
    <p><b>品质</b>：白 ×1.0 · <span style="color:#6cc46f">绿</span> ×1.3 · <span style="color:#5a9df0">蓝</span> ×1.65 · <span style="color:#b86ae0">紫</span> ×2.1 · <span style="color:#f2cf4e">金</span> ×2.7（乘在基础属性上）。</p>
    <p><b>升级</b>：最高 Lv${MAXLVL}，每级 +25% 基础属性（Lv10 = 3.25 倍）。第 N 级消耗 N 颗精华，升满共 45 颗。</p>
    <p><b>熔炼</b>：返还 品质² + 已投入精华 × 80%。例：蓝色 Lv5 → 9 + 10×0.8 = 17 精华。多余的精华可以在道具页按当前楼层的价格换成金币。</p>
    <p><b>商店</b>：每买一次涨 15%，不限次数；高星商店还卖精华与装备。</p>
    <p><b>上限</b>：闪避 60% · 暴击 80% · 吸血 50%；攻防无上限。暴击伤害 2 倍，吸血按造成伤害回血。</p>
    <p><b>掉落</b>：★1 3%、每星 +2%，Boss / 精英必掉；高层与高星更易出高品质。保底：剑盾在 3/4、13/14、23/24、33/34、43/44 层，帽鞋戒在 6~8、26~28、46~48 层。</p></div>`;
  d.innerHTML=`<div class="bagHead"><h3>背包</h3><div class="tabs"><button class="mini tab${view==='gear'?' cur':''}" data-view="gear">装备</button><button class="mini tab${view==='items'?' cur':''}" data-view="items">道具</button><button class="mini tab${view==='rules'?' cur':''}" data-view="rules">规则</button></div></div>
    <div class="res">金币 <b style="color:var(--brass)">${fmt(h.gold)}</b> · 精华 <b style="color:#b86ae0">${h.essence}</b></div>
    ${view==='gear'?`<div class="sec">已装备</div><div class="cards">${slots}</div><div class="sec">背包（${h.bag.length}/30）</div><div class="cards">${bag}</div>`:view==='items'?`<div class="cards">${items}</div>`:rules}
    <div class="opts" style="margin-top:10px"><button class="btn primary" id="bagClose">关闭</button></div>`;
  d.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return;
    if (b.id==='bagClose'){ closeDialog(); return; }
    if (b.dataset.view){ openBag(b.dataset.view); return; }
    const find=id=>{ for(const k in h.equip) if(h.equip[k]&&h.equip[k].id==id) return h.equip[k]; return h.bag.find(x=>x.id==id); };
    if (b.dataset.holy){ useHoly(); openBag('items'); return; }
    if (b.dataset.ex){ const n=b.dataset.ex==='all'?h.essence:Math.min(h.essence,+b.dataset.ex); if(n>0){ h.essence-=n; h.gold+=n*essRate(); log(`用 ${n} 精华换了 ${fmt(n*essRate())} 金。`); } openBag('items'); return; }
    if (b.dataset.eq){ const e=find(b.dataset.eq); const cur=h.equip[e.slot]; h.equip[e.slot]=e; h.bag=h.bag.filter(x=>x!==e); if(cur) h.bag.push(cur); log(`装备了${eqLabel(e)}。`); }
    if (b.dataset.off){ const e=find(b.dataset.off); if (h.bag.length>=30){ log('背包已满，先熔炼一些再卸下。'); } else { h.equip[e.slot]=null; h.bag.push(e); log(`卸下了${eqName(e)}。`); } }
    if (b.dataset.up){ const e=find(b.dataset.up); const c=upgradeCost(e); if(e.lvl>=maxLvl(e.slot)){ log(`${eqName(e)}已是最高等级 Lv${maxLvl(e.slot)}。`); } else if(h.essence<c.ess){ log(`升级需要 ${c.ess} 精华。`); } else { h.essence-=c.ess; e.lvl++; log(`${eqName(e)}升到 Lv${e.lvl}：${eqLabel(e).split('·')[1].trim()}。`,true); } }
    if (b.dataset.smelt){ const e=find(b.dataset.smelt); const was=Object.keys(h.equip).find(k=>h.equip[k]===e); if (was) h.equip[was]=null; h.bag=h.bag.filter(x=>x!==e); h.essence+=smeltValue(e); log(`熔炼${eqName(e)}，获得 ${smeltValue(e)} 精华。`); }
    openBag(view);
  });
  overlay.appendChild(d); overlay.hidden=false; renderPanel();
}
document.getElementById('bagBtn').onclick=()=>{ if(overlay.hidden && !BATTLE) openBag(); };
// ───────────── 全图鉴：按世界分页，列出该界全部怪物 ─────────────
function worldSpecies(wid){ const W=WORLDS.find(w=>w.id===wid)||WORLDS[0]; const d=DIFFS[(G&&G.diff)||'normal']; const pre=WORLD_SPR_PREFIX[wid]||''; const out=[];
  for (const k in W.species){ const b=JSON.parse(JSON.stringify(W.species[k])); if (pre && SPR[pre+b.spr]){ b.spr=pre+b.spr; b.hue=0; b.tint=null; } b.atk=Math.round(b.atk*d.atk); b.hp=Math.round(b.hp*d.hp); b.key=k; out.push(b); }
  return out.sort((a,b)=>(a.boss?2:a.elite?1:0)-(b.boss?2:b.elite?1:0) || a.lvl-b.lvl || a.star-b.star); }
function monSrcOf(def){ const im=tinted(def.spr, def.hue, def.tint); return im ? (im.toDataURL ? im.toDataURL() : im.src) : ''; }
function openDex(tab){
  const cur=tab||G.world; const worlds=WORLDS.filter(w=>G.test||isUnlocked(w.id)||w.id===G.world);
  overlay.innerHTML=''; const d=document.createElement('div'); d.className='dialog bag dex';
  const tabs=worlds.map(w=>`<button class="mini wt${w.id===cur?' cur':''}" data-w="${w.id}">${w.name}</button>`).join('');
  const W=WORLDS.find(w=>w.id===cur); const list=worldSpecies(cur);
  const sec=(title,arr)=>arr.length?`<div class="sec">${title}</div><div class="dexgrid">${arr.map(m=>`<div class="dexc${m.boss?' boss':m.elite?' elite':''}"><img src="${monSrcOf(m)}" alt="" style="transform:scale(${monScale(m)})"><div class="dn">${m.name}</div><div class="ds stars${m.boss?' boss':''}">${STAR.repeat(m.star)}</div><div class="dd">生命 ${fmt(m.hp)}<br>攻 ${fmt(m.atk)} · 防 ${fmt(m.def)}<br>${m.gold}金 ${m.exp}经${m.floor&&m.floor!==99?`<br>第 ${m.floor} 层`:m.floor===99?'<br>宝库':`<br>首现 ${m.lvl} 层`}</div></div>`).join('')}</div>`:'';
  const normal=list.filter(m=>!m.boss&&!m.elite), elites=list.filter(m=>m.elite), bosses=list.filter(m=>m.boss);
  const ar=W.struct.arena.names; const arena=`<div class="sec">试炼之间（${(branches(cur).find(b=>b.arena!=null)||{}).from||'?'} 层支线）</div><div class="dexgrid">${['demon','wraith','golem'].map((r,i)=>`<div class="dexc"><img src="${spriteImg('arena_'+r)?spriteImg('arena_'+r).src:''}" alt=""><div class="dn">${ar[i]}</div><div class="ds stars" style="color:#c98cf0">★★★</div><div class="dd">按波次增强<br>每波 ×1.15</div></div>`).join('')}</div>`;
  d.innerHTML=`<div class="bagHead"><h3>怪物图鉴</h3><div class="tabs">${tabs}</div></div>
    <div class="res">${W.name} · ${list.length} 种 · 难度 ${DIFFS[(G&&G.diff)||'normal'].n}（数值已按难度折算）</div>
    ${sec('普通怪物',normal)}${sec('守关精英',elites)}${sec('首领',bosses)}${arena}
    <div class="opts" style="margin-top:10px"><button class="btn primary" id="dexClose">关闭</button></div>`;
  d.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return; if(b.id==='dexClose'){ closeDialog(); return; } if(b.dataset.w) openDex(b.dataset.w); });
  overlay.appendChild(d); overlay.hidden=false;
}
document.getElementById('dexBtn').onclick=()=>{ if(overlay.hidden && !BATTLE) openDex(); };
function openFly(tab){
  if (!G.test && G.floor>=HIDDEN_START){ log('隐藏楼层里无法使用传送卷轴。'); return; }
  if (!G.test && wstruct().special==='lava' && !'<>'.includes(G.maps[G.floor][G.y][G.x]||'') && G.floor!==0){ log('地下的传送卷轴只能在楼梯口使用。'); return; }
  const worlds = WORLDS.filter(w => G.test || isUnlocked(w.id));
  const cur = tab || G.world;
  overlay.innerHTML=''; const d=document.createElement('div'); d.className='dialog bag';
  const tabs = worlds.map(w=>`<button class="mini wt${w.id===cur?' cur':''}" data-w="${w.id}">${w.name}</button>`).join('');
  const st = (G.worlds&&G.worlds[cur]) || null;
  let floors;
  if (G.test) floors=[...Array((WORLDS.find(w=>w.id===cur)||WORLDS[0]).maps.length).keys()];
  else floors=(st?st.visited:[]).filter(f=>f<HIDDEN_START).slice().sort((a,b)=>a-b);
  const btn = f => `<button class="mini jf${(cur===G.world&&f===G.floor)?' cur':''}" data-f="${f}">${floorLabel(f,cur).replace(/^第 | 层$/g,'')}</button>`;
  const main=floors.filter(f=>f<HIDDEN_START).map(btn).join(''), hid=floors.filter(f=>f>=HIDDEN_START).map(btn).join('');
  d.innerHTML=`<h3>传送</h3><p>${G.test?'测试模式：全部世界与楼层开放。':'可前往去过的楼层，以及已开启世界的序章；落在楼梯口。'}</p>
    <div class="jgrid" style="grid-template-columns:repeat(${worlds.length},1fr)">${tabs}</div>
    <div class="jgrid" style="margin-top:8px">${main || (cur!==G.world ? btn(0) : '<span class="dim" style="font-size:12px">还没有去过的楼层</span>')}</div>
    ${hid?`<div style="font-family:var(--display);letter-spacing:.15em;color:var(--brass);font-size:13px;margin-top:8px">隐藏支线</div><div class="jgrid">${hid}</div>`:''}
    <div class="opts" style="margin-top:10px"><button class="btn primary" id="flyClose">关闭</button></div>`;
  d.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return;
    if (b.id==='flyClose'){ closeDialog(); return; }
    if (b.dataset.w){ openFly(b.dataset.w); return; }
    if (b.dataset.f!=null){ const f=+b.dataset.f; closeDialog(); if (cur!==G.world) switchWorld(cur, f); else jumpTo(f); } });
  overlay.appendChild(d); overlay.hidden=false;
}
const essRate = () => Math.max(5, Math.round((20+6*Math.max(1,Math.min(50,G.floor)))*0.25));   // 1 精华 ≈ 当前层商店基价的 1/4
function useHoly(){ const h=G.hero; if(h.holy>0){ const g=Math.floor(h.hp*0.3); h.holy--; h.hp+=g; flashText(G.x,G.y,'+'+fmt(g),'#7fe39a'); log(`使用圣水：生命 +${fmt(g)}（当前的 30%）。`,true); } }
document.getElementById('flyBtn').onclick=()=>{ if(overlay.hidden && !BATTLE && (G.hero.fly||G.test)) openFly(); };
function openSettings(){
  dialog('设置','战斗动画会演示每回合的攻防与掉血；关闭后战斗立即结算。装备掉落“标准”为 ★1 3%、每星 +2%，Boss 必掉；“稀少”减半，“丰富”为 2.5 倍。',[
    [`战斗动画：${SET.anim?'开':'关'}`, '切换', ()=>{ SET.anim=!SET.anim; saveSettings(); openSettings(); }],
    [`动画速度：${SET.speed===1?'正常':SET.speed===2?'快':'很快'}`, '切换', ()=>{ SET.speed=SET.speed===1?2:SET.speed===2?3:1; saveSettings(); openSettings(); }, !SET.anim],
    [`装备掉落：${(DROP_MODES[SET.drop]||DROP_MODES.normal).n}`, '切换', ()=>{ const ks=Object.keys(DROP_MODES); SET.drop=ks[(ks.indexOf(SET.drop)+1)%ks.length]; saveSettings(); openSettings(); render(); }],
    ...(DEV ? [[`测试模式：${G.test?'开':'关'}`, '秒杀 · 无限钥匙 · 跳层', ()=>{ toggleTest(); openSettings(); }]] : []),
    ['完成', null, null],
  ]);
}
function toggleTest(){
  if (!DEV) return;
  const h=G.hero;
  if (!G.test){ G.test={...h}; Object.assign(h,{hp:999999,atk:99999,def:99999,ykey:99,bkey:99,rkey:99,manual:1}); log('测试模式开启：秒杀所有怪物，钥匙无限，可用按钮跳层。',true); }
  else { Object.assign(h, G.test); G.test=null; log('测试模式关闭，属性已恢复。'); }
  render();
}
function jumpTo(nf){
  if (nf<0||nf>=G.maps.length||BATTLE) return;
  const p = stairsOf(nf,'<') || stairsOf(nf,'>') || stairsOf(nf,'@');
  G.floor=nf; if (p){ G.x=p.x; G.y=p.y; }
  if (nf===arenaIdx() && !G.arena) setupArena(false);
  G.maxFloor=Math.max(G.maxFloor,Math.min(50,G.floor)); visit(nf); log(`传送到${floorLabel(nf)}。`); if(!overlay.hidden) closeDialog(); save(true); render();
}

document.getElementById('setBtn').onclick=()=>{ if(overlay.hidden && !BATTLE) openSettings(); };
document.getElementById('saveBtn').onclick=()=>{ if(overlay.hidden && !BATTLE) save(false); };
window.addEventListener('pagehide',()=>{ try{ if(G) writeSlot(0); }catch(e){} });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ try{ if(G) writeSlot(0); }catch(e){} } });
document.getElementById('loadBtn').onclick=()=>{ if(overlay.hidden && !BATTLE) load(); };
document.getElementById('resetBtn').onclick=()=>{ if(!overlay.hidden||BATTLE) return; dialog('重新开始？','当前进度会丢失（存档不受影响）。',[['选择世界并重新开始',null,()=>{chooseWorld();}],['取消',null,null]]); };

// ───────────── 启动（含热更新保留进度）─────────────
const MAP_VERSION = 34;   // 地图数据版本：升级时把存档里未到过的楼层换成新图，到过的楼层补上新增道具
function migrateMaps(){
  if (G.mapVersion === MAP_VERSION) return;
  if ((G.mapVersion||0) < 34 && G.hero){ const k=WORLD_ORDER.indexOf(G.world); for (const e of [...(G.hero.bag||[]), ...Object.values(G.hero.equip||{})]) if (e && e.wk0==null){ e.wk0=k; e.base0=e.base; } }
  const W=worldOf(); if (!W.maps) return; let patched=0;
  if ((G.mapVersion||0) < 31 && G.worlds){   // 各界支线结构有变：隐藏层全部重置，站在隐藏层里的话送回入口层
    for (const wid in G.worlds){ const st=G.worlds[wid]; const Wd=WORLDS.find(w=>w.id===wid); if(!Wd||!st.maps) continue;
      for (let f=HIDDEN_START; f<Wd.maps.length; f++) st.maps[f]=Wd.maps[f].map(r=>r.split('')); st.maps.length=Wd.maps.length; st.arena=null;
      if (st.visited) st.visited=st.visited.filter(f=>f<HIDDEN_START);
      if (st.floor>=HIDDEN_START){ st.floor=Math.min(50, st.maxFloor||1); const m=st.maps[st.floor]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(m[y][x]==='<'){ st.x=x; st.y=y; } } }
    if (G.floor>=HIDDEN_START){ bindWorld(G.world); }
  }
  if ((G.mapVersion||0) < 17){   // 新增序章（第 0 层）：所有楼层下标 +1；旧版隐藏层一并重置
    const shift = o => { const r={}; for (const k in o){ const m=/^(\d+)(.*)$/.exec(k); r[m?(+m[1]+1)+m[2]:k]=o[k]; } return r; };
    G.maps = G.maps.slice(0,51); G.maps.unshift(W.maps[0].map(r=>r.split('')));
    G.floor = G.floor>=51 ? 40 : G.floor+1; G.maxFloor=Math.min(50,(G.maxFloor||0)+1);
    G.shopBought=shift(G.shopBought||{}); G.cracks=shift(G.cracks||{}); G.plates=shift(G.plates||{}); G.arena=null; G.intro=true;
    for (let f=HIDDEN_START; f<W.maps.length; f++) G.maps[f]=W.maps[f].map(r=>r.split(''));
    const p=stairsOf(G.floor,'<')||stairsOf(G.floor,'>'); if (p && G.maps[G.floor][G.y] && '#$'.includes(G.maps[G.floor][G.y][G.x]||'#')){ G.x=p.x; G.y=p.y; }
  }
  W.maps.forEach((rows,f)=>{
    const fresh=rows.map(r=>r.split(''));
    if (f > (G.maxFloor||0)) { G.maps[f]=fresh; patched++; return; }
    const old=G.maps[f]; if(!old) { G.maps[f]=fresh; return; }
    if (rows.some(r=>r.includes('$'))){   // 商店楼层：按新图重排，已拿走的东西保持为空地
      for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (old[y][x]==='.' && !'#$'.includes(fresh[y][x])) fresh[y][x]='.';
      G.maps[f]=fresh; patched++;
      if (G.floor===f && '#$'.includes(fresh[G.y][G.x])){ const p=stairsOf(f,'<')||stairsOf(f,'>'); if(p){ G.x=p.x; G.y=p.y; } }
      return;
    }
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      if ('345m9780o6!%&*'.includes(fresh[y][x]) && old[y][x]==='.') { old[y][x]=fresh[y][x]; patched++; }
      if (fresh[y][x]==='6' && old[y][x]==='#') { old[y][x]='6'; patched++; }
      if (fresh[y][x]==='.' && old[y][x]==='#') { old[y][x]='.'; patched++; }          // 新版打通的通道（如商店门口）
      if (fresh[y][x]==='$' && old[y][x]==='#') { old[y][x]='$'; patched++; }          // 商店扩大占格
    }
  });
  G.mapVersion = MAP_VERSION; if (patched) log('地图已更新到新版本：未到过的楼层换成了新布局，到过的楼层补上了新道具。');
}
function visit(f){ if(!G.visited) G.visited=[]; if(!G.visited.includes(f)) G.visited.push(f); }
function fixHero(){ G.hero.hp=Math.round(G.hero.hp); G.hero.atk=Math.round(G.hero.atk); G.hero.def=Math.round(G.hero.def); if(!G.diff) G.diff='normal'; if(!WORLDS.find(w=>w.id===G.world)) G.world='tower';
  if (!G.worlds){ G.worlds={}; G.worlds[G.world]={}; for (const k of WORLD_FIELDS) G.worlds[G.world][k]=G[k]; if(G.worlds[G.world].intro==null) G.worlds[G.world].intro=!!G.intro; }
  bindWorld(G.world); setWorldData(G.world); migrateMaps(); syncWorld(); if(!G.cracks) G.cracks={}; if(!G.plates) G.plates={}; if(!G.visited){ G.visited=[]; for(let f=0;f<=Math.min(50,G.maxFloor||0);f++) G.visited.push(f); } if(G.hero.fly==null) G.hero.fly=G.intro?1:0; if(G.hero.holy==null) G.hero.holy=0; if(G.arena) setupArena(false); const h=G.hero; if(!h.equip) h.equip={sword:null,shield:null,boots:null,hat:null,ring:null}; if(!h.bag) h.bag=[]; if(h.essence==null) h.essence=0; let mx=0; for(const e of [...h.bag,...Object.values(h.equip)]) if(e) mx=Math.max(mx,e.id); _eqId=mx+1; }
function start(data){ let fresh=false; if (data && data.G && (data.G.maps||data.G.worlds) && data.G.world) G=data.G; else { let a=null, best=-1; for (let i=0;i<=5;i++){ const it=slotInfo(i); if (it && it.g && (it.g.maps||it.g.worlds)){ const t=it.g.savedAt||0; if (t>best){ best=t; a=it; } } } if (a) G=a.g; /* 打开时续上最新的存档（含自动存档） */ else { newGame('tower'); fresh=true; } } fixHero(); loadSprites(()=>{ render(); if (fresh) setTimeout(chooseWorld, 300); else if(!G.intro) setTimeout(()=>openElder(0), 400); }); }   // 新开局先选世界与难度
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(()=>{ syncWorld(); return {G}; });
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(start) : start(window.claude && window.claude.hot ? window.claude.hot.data : null);
</script>
